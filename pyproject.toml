[project]
name = "hp-fold"
version = "0.1.0"
description = "Quantum Algorithms for Lattice Protein Folding."
readme = "README.md"
authors = [
    { name = "Kaue Miziara", email = "kauemiziara@gmail.com" },
    { name = "Julia Santos", email = "juliasantos7652@gmail.com" },
]
requires-python = ">=3.14"
dependencies = [
    "biopython>=1.88",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pylatexenc>=2.11",
    "python-dotenv>=1.2.4",
    "qiskit>=2.5.2",
    "qiskit-aer>=0.17.2",
    "qiskit-ibm-runtime>=0.50.0",
    "qiskit-ionq>=1.1.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pre-commit>=4.6.2", "pyright>=1.1.414", "pytest>=9.1.1", "ruff>=0.17.0"]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "N", "UP"]

ignore = ["E741", "N806"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"scripts/*.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
exclude = [".venv", "data"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
