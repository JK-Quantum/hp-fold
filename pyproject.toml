[project]
name = "hp-fold"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kaue Miziara", email = "kauemiziara@gmail.com" },
    { name = "Julia Santos", email = "juliasantos7652@gmail.com" },
]
requires-python = ">=3.14"
dependencies = [
    "biopython>=1.88",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pylatexenc>=2.11",
    "qiskit>=2.5.2",
    "qiskit-aer>=0.17.2",
    "qiskit-ibm-runtime>=0.50.0",
    "qiskit-ionq>=1.1.1",
]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1"]
