# CVaR-QAOA (alpha 0.05, 0.1, 0.25) at depths 1-3 against plain QAOA and random, on a fragment of 1UBQ.

seed = 0
output = "data/results/qaoa_cvar"

[problem]
cif = "data/raw/1UBQ.cif"
length = 6
pick = 0

[[runs]]
algorithm = "random"
repeats = 5

[runs.params]
n_samples = 1000

[[runs]]
