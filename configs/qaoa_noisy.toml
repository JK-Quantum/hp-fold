# Ideal vs depolarizing-noise QAOA at depths 1-3, with a random reference, on a fragment of 1UBQ.

seed = 0
output = "data/results/qaoa_noisy"

[problem]
cif = "data/raw/1UBQ.cif"
length = 6
pick = 0

[[runs]]
algorithm = "random"
repeats = 5

[runs.params]
n_samples = 1000

[[runs]]
algorithm = "qaoa"
repeats = 5

[runs.params]
p = 1
restarts = 5
maxiter = 300
shots = 1024

[[runs]]
algorithm = "qaoa"
repeats = 5

[runs.params]
p = 2
restarts = 5
maxiter = 300
shots = 1024

[[runs]]
algorithm = "qaoa"
repeats = 5

[runs.params]
p = 3
restarts = 5
maxiter = 300
shots = 1024

[[runs]]
algorithm = "qaoa_noisy"
repeats = 5

[runs.params]
p = 1
restarts = 5
maxiter = 300
shots = 1024
error_1q = 0.0002
error_2q = 0.002
readout_error = 0.01

[[runs]]
algorithm = "qaoa_noisy"
repeats = 5

[runs.params]
p = 2
restarts = 5
maxiter = 300
shots = 1024
error_1q = 0.0002
error_2q = 0.002
readout_error = 0.01

[[runs]]
algorithm = "qaoa_noisy"
repeats = 5

[runs.params]
p = 3
restarts = 5
maxiter = 300
shots = 1024
error_1q = 0.0002
error_2q = 0.002
readout_error = 0.01
