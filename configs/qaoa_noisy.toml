# Ideal vs depolarizing-noise QAOA (p = 1), with a random reference, on a fragment of 1UBQ.

seed = 0
output = "data/results/qaoa_noisy"

[problem]
cif = "data/raw/1UBQ.cif"
length = 6
pick = 0

[[runs]]
algorithm = "random"
repeats = 5

[runs.params]
n_samples = 1000

[[runs]]
algorithm = "qaoa"
repeats = 3

[runs.params]
p = 1
restarts = 3
maxiter = 100
shots = 512

[[runs]]
algorithm = "qaoa_noisy"
repeats = 3

[runs.params]
p = 1
restarts = 3
maxiter = 100
shots = 512
error_1q = 0.001
error_2q = 0.01
readout_error = 0.01
