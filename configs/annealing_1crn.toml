# Simulated-annealing baseline (with a random reference) on a fragment of 1CRN.

seed = 0
output = "data/results/annealing_1crn"

[problem]
cif = "data/raw/1CRN.cif"
length = 6
pick = 1

[[runs]]
algorithm = "random"
repeats = 5

[runs.params]
n_samples = 1000

[[runs]]
algorithm = "annealing"
repeats = 5

[runs.params]
n_samples = 100
