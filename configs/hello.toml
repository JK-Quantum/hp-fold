# Default experiment: read by scripts/run_experiment.py.
# Relative paths resolve against the repository root.

seed = 0
output = "data/results/runs"

[problem]
sequence = "PHPPH" # H = hydrophobic, P = polar
# penalty = 5.0         # optional; default is the number of residues

[[runs]]
algorithm = "random"
repeats = 5

[runs.params]
n_samples = 200

[[runs]]
algorithm = "annealing"
repeats = 5

[runs.params]
n_samples = 200
