# Simulated-annealing baseline (with a random reference) on a fragment of 1UBQ.

seed = 0
output = "data/results/annealing"

[problem]
cif = "data/raw/1UBQ.cif"
length = 6
pick = 0

[[runs]]
algorithm = "random"
repeats = 5

[runs.params]
n_samples = 1000

[[runs]]
algorithm = "annealing"
repeats = 5

[runs.params]
n_samples = 100
