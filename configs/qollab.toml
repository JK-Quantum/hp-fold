# Qollab run: train QAOA / CVaR-QAOA locally, evaluate the trained circuits on the backend.
# `shots` comes from main(); it is not set here.

seed = 0

[problem]
cif = "data/raw/1UBQ.cif"
length = 6
pick = 0

[[runs]]
algorithm = "random"

[runs.params]
n_samples = 1000

[[runs]]
algorithm = "qaoa"

[runs.params]
p = 1
restarts = 3
maxiter = 100
landscape_grid = 15

[[runs]]
algorithm = "qaoa"

[runs.params]
p = 2
restarts = 3
maxiter = 100

[[runs]]
algorithm = "qaoa_cvar"

[runs.params]
p = 2
cvar_alpha = 0.05
restarts = 3
maxiter = 100

[[runs]]
algorithm = "qaoa_cvar"

[runs.params]
p = 2
cvar_alpha = 0.1
restarts = 3
maxiter = 100

[[runs]]
algorithm = "qaoa_cvar"

[runs.params]
p = 2
cvar_alpha = 0.25
restarts = 3
maxiter = 100
